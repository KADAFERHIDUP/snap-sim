name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build dan test
        run: mvn -B -ntp verify

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t snap-sim:ci .
      - name: Jalankan dan tunggu sehat
        run: |
          docker run -d --name snap -p 8080:8080 snap-sim:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' snap)
            echo "health: $status"
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' snap)" = "healthy" ] || { docker logs snap; exit 1; }
      - name: Uji asap
        run: |
          curl -fsS http://localhost:8080/ | grep -q 'snap-sim'
          curl -fsS http://localhost:8080/app.js > /dev/null
          # tanpa tanda tangan harus ditolak dengan kode SNAP, bukan error server
          code=$(curl -s -H 'Content-Type: application/json' -d '{}' http://localhost:8080/snap/v1.0/balance-inquiry | grep -o '"responseCode":"[0-9]*"')
          echo "$code"
          [ "$code" = '"responseCode":"4001102"' ]
